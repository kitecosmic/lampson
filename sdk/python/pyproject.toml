[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lampson"
version = "0.5.0"
description = "Lampson SDK: talk to Lampson agents from Python — server mode (HTTP API) or local mode (Lampson as a child process)."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []
keywords = ["agent", "llm", "lampson", "sdk", "mcp"]

[project.urls]
Homepage = "https://github.com/kitecosmic/lampson"

[tool.setuptools]
packages = ["lampson"]
