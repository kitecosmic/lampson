name: publish to PyPI
# Publishes the Python SDK (sdk/python) when a version tag is pushed, like publish.yml does for npm. No PyPI token:
# PyPI "trusted publishing" accepts this workflow through GitHub's OIDC identity. Configure once on pypi.org →
# project lampson → Settings → Publishing → Add a new publisher → GitHub:
#   owner kitecosmic · repository lampson · workflow publish-pypi.yml · environment pypi
# The tag must match sdk/python/pyproject.toml ("version") — the job refuses otherwise. workflow_dispatch publishes
# the version in pyproject.toml of the chosen branch (to publish a tag that was pushed before this was set up).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: tag must match pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('sdk/python/pyproject.toml','rb'))['project']['version'])")
          [ "refs/tags/v$v" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF ≠ pyproject v$v"; exit 1; }
      # npm first: without a global lampson, local mode runs `npx lampson@<this version>`, so a Python release whose
      # npm twin is not out yet breaks on every such machine. Wait for it (publish.yml runs on the same tag); if npm
      # failed, this fails too and nothing reaches PyPI.
      - name: lampson@<version> must be on npm
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('sdk/python/pyproject.toml','rb'))['project']['version'])")
          for i in $(seq 1 90); do
            [ "$(npm view "lampson@$v" version 2>/dev/null)" = "$v" ] && { echo "lampson@$v is on npm"; exit 0; }
            sleep 10
          done
          echo "lampson@$v is not on npm after 15 min: not publishing to PyPI"; exit 1
      - name: build
        run: |
          python -m pip install --upgrade build
          python -m build sdk/python
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
