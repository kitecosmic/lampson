<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>Lampson · equipos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131412">
<link rel="manifest" href="/manifest.webmanifest">
<!-- la pantalla de equipos y objetivos: página propia, a pantalla completa (no un panel del agente de programación).
     tokens.css = fuentes, paleta y botones de Lampson; teams.css = esta pantalla; js/teams.js = todo el comportamiento -->
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/teams.css">
<script>(function(){try{var t=localStorage.getItem('lampson.theme');if(t!=='light'&&t!=='dark'){t='dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<header class="tbar">
  <nav class="crumbs" id="crumbs" aria-label="dónde estás"></nav>
  <span class="spacer"></span>
  <a class="alllink" href="/equipos" title="equipos y objetivos de todos tus proyectos">todos los equipos</a>
  <span class="live" id="live" title="actualizado en vivo">en vivo</span>
  <button class="theme-toggle" id="theme" type="button" title="cambiar tema"></button>
</header>

<!-- lo que espera a la persona: aprobaciones y preguntas de los objetivos (siempre visible) -->
<section class="attention" id="attention" hidden></section>

<!-- una página por nivel, cada una con su URL (js/teams.js lee la ruta):
     /w/<p>/equipos                         los equipos del proyecto (y los objetivos de un agente solo)
     /w/<p>/equipos/nuevo                   plantillas → el lienzo del equipo nuevo
     /w/<p>/equipos/<equipo>                sus objetivos y rutinas
     /w/<p>/equipos/<equipo>/editar         el lienzo
     /w/<p>/equipos/<equipo>/objetivos/nuevo · /rutinas/nueva   el formulario
     /w/<p>/equipos/<equipo>/objetivos/<n>  un objetivo (o una ejecución de una rutina)
     /w/<p>/equipos/<equipo>/rutinas/<id>   una rutina y sus ejecuciones
     /w/<p>/objetivos/<n>                   un objetivo de un agente solo -->
<main class="view teamsview" id="v-teams">
  <section class="tlist" id="tlist" hidden></section>
  <section class="tlist" id="tpage" hidden></section>
  <section class="tlist" id="rpage" hidden></section>
  <div class="opage" id="opage" hidden>
    <section class="odetail" id="objDetail"></section>
    <aside class="odrawer" id="objDrawer" hidden><div class="odhead"><b id="odTitle">Registro</b><button type="button" class="iclose" id="odClose" title="cerrar">✕</button></div>
      <ol class="log" id="objLog"></ol><div class="odseat" id="odSeat" hidden></div></aside>
  </div>
  <div class="tedit" id="tedit" hidden>
    <div class="tsub editing" id="tsub"></div>
    <div class="canvas" id="canvas">
      <div id="graph" role="application" aria-label="el equipo: quién le reporta a quién"></div>
      <div class="ov ov-add" id="ovAdd"></div>
      <aside class="ov ov-insp" id="inspector" hidden></aside>
    </div>
  </div>
  <div class="ov ov-wizard" id="wizard" hidden></div>
  <div class="ov ov-wizard" id="objNew" hidden></div>
</main>

<script src="/js/flow.js"></script>
<script src="/js/teams.js"></script>
<script src="/js/objlive.js"></script>
<script src="/js/objdiag.js"></script>
</body>
</html>
