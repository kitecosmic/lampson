<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lampson</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0e1013; --panel:#14171c; --panel2:#1a1e25; --line:#262b34; --fg:#e8eaee; --dim:#8b93a3; --dimmer:#5c6474; --acc:#7cc4ff; --acc2:#b48cff; --warn:#ffb86b; --bad:#ff6b6b; --ok:#8fe388; --mono: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace; --sans: system-ui, "Segoe UI", Roboto, sans-serif; }
  * { box-sizing: border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--fg); font: 14px/1.55 var(--sans); display:grid; grid-template-rows: 46px 1fr; grid-template-columns: 300px 1fr; grid-template-areas: "top top" "side main"; }
  header { grid-area: top; display:flex; align-items:center; gap:14px; padding:0 16px; border-bottom:1px solid var(--line); background:var(--panel); }
  header .logo { font: 700 15px var(--mono); color:var(--acc); letter-spacing:.5px; }
  header .proj { font: 13px var(--mono); color:var(--fg); }
  header .proj small { color:var(--dimmer); margin-left:8px; }
  header .spacer { flex:1; }
  header select, header .pill { font: 12.5px var(--mono); background:var(--panel2); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  header .pill { color:var(--dim); }
  aside { grid-area: side; border-right:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; min-height:0; }
  aside h2 { font: 600 11px var(--sans); letter-spacing:1px; text-transform:uppercase; color:var(--dimmer); margin:0; padding:10px 14px 6px; }
  #tree { flex:1; overflow:auto; padding:0 6px 10px; font: 12.5px var(--mono); }
  .node { user-select:none; }
  .row { display:flex; align-items:center; gap:6px; padding:2px 8px; border-radius:5px; cursor:pointer; color:var(--dim); white-space:nowrap; }
  .row:hover { background:var(--panel2); color:var(--fg); }
  .row.dir { color:var(--fg); }
  .row .tw { width:10px; color:var(--dimmer); font-size:10px; }
  .row.active { background:var(--panel2); color:var(--acc); }
  .row.gM > span:last-child { color:var(--warn); }
  .row.gA > span:last-child, .row.gU > span:last-child { color:var(--ok); }
  .row.gD > span:last-child { color:var(--bad); text-decoration:line-through; }
  .row .gs { margin-left:auto; font-size:10px; color:var(--dimmer); }
  header .git { font: 12px var(--mono); color:var(--dim); }
  .kids { margin-left:14px; border-left:1px solid var(--line); }
  .kids.hidden { display:none; }
  #sessions { max-height:32%; overflow:auto; border-top:1px solid var(--line); padding-bottom:8px; }
  .s { padding:5px 14px; cursor:pointer; color:var(--dim); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .s:hover, .s.active { background:var(--panel2); color:var(--fg); }
  .s .id { color:var(--dimmer); font-family:var(--mono); font-size:11px; margin-right:6px; }
  main { grid-area: main; display:grid; grid-template-rows: 1fr auto; min-height:0; min-width:0; }
  #stage { overflow:auto; min-height:0; }
  #log { padding:20px 28px; max-width: 1000px; }
  #viewer { display:none; padding:0; }
  #viewer .vh { position:sticky; top:0; display:flex; gap:12px; align-items:center; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line); font: 12.5px var(--mono); color:var(--dim); }
  #viewer .vh b { color:var(--fg); font-weight:500; }
  #viewer pre { margin:0; padding:14px 16px; font: 12.5px/1.5 var(--mono); tab-size:4; }
  #viewer pre .ln { display:inline-block; width:4ch; margin-right:14px; color:var(--dimmer); text-align:right; user-select:none; }
  .msg { margin:0 0 16px; }
  .user { border-left:3px solid var(--acc); padding:10px 14px; background:linear-gradient(90deg, rgba(124,196,255,.14), rgba(124,196,255,.04)); border-radius:0 10px 10px 0; white-space:pre-wrap; margin:22px 0 14px; font-size:14.5px; }
  .user::before { content:"vos"; display:block; font: 600 10.5px var(--sans); letter-spacing:1px; text-transform:uppercase; color:var(--acc); margin-bottom:4px; }
  .assistant { padding:2px 0; }
  .assistant p { margin:0 0 10px; }
  .assistant code { font: 12.5px var(--mono); background:var(--panel2); padding:1px 5px; border-radius:4px; }
  .assistant pre { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; overflow-x:auto; }
  .assistant pre code { background:none; padding:0; }
  .assistant ul, .assistant ol { margin:0 0 10px 22px; }
  .assistant h1, .assistant h2, .assistant h3 { font-size:15px; margin:12px 0 6px; }
  .step { display:grid; grid-template-columns: 18px 1fr; column-gap:8px; margin:0 0 8px 6px; font: 12.5px var(--mono); color:var(--dim); }
  .step .cmd { color:var(--warn); white-space:pre-wrap; word-break:break-word; max-height:4.6em; overflow:hidden; }
  .step .cmd.open { max-height:none; }
  .step .more { color:var(--dimmer); cursor:pointer; font-size:11px; }
  .step details { grid-column: 2; }
  .step .ic { width:16px; text-align:center; }
  .step .name { color:var(--warn); }
  .step .ok { color:var(--ok); }
  .step .bad { color:var(--bad); }
  .step summary.bad { color:var(--bad); }
  .step details { flex:1; min-width:0; }
  .step summary { cursor:pointer; list-style:none; color:var(--dim); white-space:pre-wrap; word-break:break-word; max-height:3.2em; overflow:hidden; }
  .step summary::before { content:"→ "; color:var(--dimmer); }
  .step pre { margin:6px 0 0; padding:10px; background:var(--panel2); border-radius:6px; white-space:pre-wrap; max-height:340px; overflow:auto; font-size:12px; }
  .denied { color:var(--bad); }
  .approval .card { background:var(--panel); border:1px solid var(--warn); border-radius:10px; padding:10px 14px; max-width:720px; }
  .approval .why { color:var(--warn); font-size:13px; margin-bottom:6px; }
  .approval code { font: 12.5px var(--mono); display:block; background:var(--panel2); padding:6px 8px; border-radius:6px; margin-bottom:8px; }
  .approval .btns { display:flex; gap:8px; }
  .approval button { padding:6px 14px; }
  .meta { color:var(--dimmer); font: 12px var(--mono); margin:4px 0 18px 6px; }
  .empty { max-width:760px; margin:40px auto; color:var(--dim); }
  .empty h1 { font: 600 22px var(--sans); color:var(--fg); margin:0 0 6px; }
  .empty .lead { margin:0 0 22px; }
  .empty .grid { display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
  .empty .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .empty .card h3 { font: 600 12px var(--sans); letter-spacing:.8px; text-transform:uppercase; color:var(--dimmer); margin:0 0 8px; }
  .empty .card p { margin:0 0 6px; font-size:13px; }
  .empty code, .empty .k { font: 12px var(--mono); background:var(--panel2); padding:1px 6px; border-radius:4px; color:var(--fg); }
  .empty .try { cursor:pointer; color:var(--acc); }
  .empty .try:hover { text-decoration:underline; }
  form { padding:12px 28px 6px; border-top:1px solid var(--line); background:var(--panel); }
  .composer { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:8px 8px 6px 12px; }
  .composer:focus-within { border-color:var(--acc); }
  textarea { display:block; width:100%; resize:none; min-height:44px; max-height:220px; background:transparent; color:var(--fg); border:0; padding:4px 0; font: 14px/1.5 var(--sans); }
  textarea:focus { outline:none; }
  .crow { display:flex; align-items:center; gap:8px; margin-top:4px; }
  .crow .tools { color:var(--dimmer); font-size:11.5px; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crow .keys { color:var(--dimmer); font-size:11px; }
  button { background:var(--acc); color:#0b1220; border:0; border-radius:8px; padding:6px 12px; cursor:pointer; font: 600 12.5px var(--sans); }
  button:disabled { opacity:.35; cursor:default; }
  #send { width:34px; height:30px; padding:0; border-radius:8px; font-size:16px; line-height:1; }
  #stop { background:var(--bad); color:#fff; display:none; height:30px; }
  form.busy #send { display:none; } form.busy #stop { display:inline-flex; align-items:center; gap:6px; }
  .working { display:flex; align-items:center; gap:8px; color:var(--dim); font: 12px var(--mono); margin:4px 0 14px 6px; }
  .working .dot { width:8px; height:8px; border-radius:50%; background:var(--acc); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity:.25 } 50% { opacity:1 } }
  #procs { border-top:1px solid var(--line); max-height:22%; overflow:auto; padding-bottom:6px; }
  #ports { max-height:18%; overflow:auto; padding-bottom:6px; }
  .p .port { color:var(--warn); font-weight:600; }
  .p { display:flex; align-items:center; gap:8px; padding:5px 14px; font: 12.5px var(--mono); color:var(--dim); cursor:pointer; }
  .p:hover, .p.active { background:var(--panel2); color:var(--fg); }
  .p .st { width:8px; height:8px; border-radius:50%; background:var(--dimmer); flex:none; }
  .p.run .st { background:var(--ok); }
  .p .nm { font-weight:600; color:var(--fg); }
  .p .cm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  .p button { padding:2px 8px; font-size:11px; }
  #viewer pre.log { color:var(--dim); }
  .ghost { background:var(--panel2); color:var(--fg); font-weight:500; }
  .hint { display:none; }
</style>
</head>
<body>
<header>
  <span class="logo">LAMPSON</span>
  <span class="proj" id="proj">…</span>
  <span class="git" id="git"></span>
  <span class="spacer"></span>
  <select id="agent" title="perfil de agente: qué tools puede usar"></select>
  <select id="perm" title="qué pasa con un comando peligroso (rm -rf, git push --force, sudo…)"><option value="ask">permisos: preguntar</option><option value="yolo">permisos: permitir todo</option><option value="strict">permisos: denegar</option></select>
  <span class="pill" id="model" title="modelo (LAMPSON_MODEL)">…</span>
  <button class="ghost" id="new" title="empezar una conversación nueva">+ sesión</button>
</header>
<aside>
  <h2>Archivos del workspace</h2>
  <div id="tree"></div>
  <h2>Procesos <span id="procCount" style="color:var(--dimmer)"></span></h2>
  <div id="procs"></div>
  <h2>Puertos abiertos</h2>
  <div id="ports"></div>
  <h2>Sesiones</h2>
  <div id="sessions"></div>
</aside>
<main>
  <div id="stage">
    <div id="viewer"><div class="vh"><b id="vpath"></b><span id="vmeta"></span><span class="spacer"></span><span class="try" id="vclose" style="cursor:pointer">✕ cerrar</span></div><pre id="vbody"></pre></div>
    <div id="log"></div>
  </div>
  <div>
    <form id="f">
      <div class="composer">
        <textarea id="in" rows="1" placeholder="¿Qué hacemos en este proyecto?  ·  !comando lo corrés vos"></textarea>
        <div class="crow"><span class="tools" id="agentHint2"></span><span class="keys">Enter envía · Shift+Enter salto</span><button id="stop" type="button" title="cortar el turno actual">■ detener</button><button id="send" type="submit" title="enviar (Enter)">↑</button></div>
      </div>
    </form>
    <div class="hint" id="agentHint"></div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
const log = $('#log');
let session = new URLSearchParams(location.search).get('session') || localStorage.getItem('lampson.session') || '';
let busy = false; let cfg = {};

function esc(s) { return String(s ?? '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function md(src) { // Markdown mínimo: code fences, inline code, bold, headers, listas, párrafos
  const blocks = []; src = String(src ?? '').replace(/```(\w*)\n([\s\S]*?)```/g, (m, l, c) => { blocks.push('<pre><code>' + esc(c) + '</code></pre>'); return '' + (blocks.length - 1) + ''; });
  let h = esc(src).replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.split(/\n{2,}/).map(p => {
    if (/^\d+$/.test(p.trim())) return p;
    if (/^#{1,3} /.test(p)) return '<h3>' + p.replace(/^#{1,3} /, '') + '</h3>';
    if (/^(\s*[-*] .*\n?)+$/.test(p)) return '<ul>' + p.split('\n').map(l => '<li>' + l.replace(/^\s*[-*] /, '') + '</li>').join('') + '</ul>';
    if (/^(\s*\d+[.)] .*\n?)+$/.test(p)) return '<ol>' + p.split('\n').map(l => '<li>' + l.replace(/^\s*\d+[.)] /, '') + '</li>').join('') + '</ol>';
    return '<p>' + p.replace(/\n/g, '<br>') + '</p>';
  }).join('');
  return h.replace(/(\d+)/g, (m, i) => blocks[+i]);
}
function add(cls, html) { $('#viewer').style.display = 'none'; log.style.display = ''; const d = document.createElement('div'); d.className = 'msg ' + cls; d.innerHTML = html; log.appendChild(d); $('#stage').scrollTop = $('#stage').scrollHeight; return d; }
function describe(c) { const a = c.args || {}; if (c.name === 'bash') return '$ ' + (a.command || ''); if (c.name === 'delegate') return 'delegate → ' + a.agent + ': ' + String(a.brief || '').slice(0, 80); if (a.path) return c.name + ' ' + a.path; if (a.pattern) return c.name + ' ' + a.pattern; if (a.name) return c.name + ' ' + a.name; return c.name + ' ' + JSON.stringify(a); }
function cmdHtml(text) { const t = String(text); const long = t.length > 220 || t.split('\n').length > 4; return `<span class="cmd">${esc(t)}</span>` + (long ? ' <span class="more">ver todo</span>' : ''); }
function wireMore(el) { const m = el.querySelector('.more'); if (m) m.onclick = () => { el.querySelector('.cmd').classList.toggle('open'); m.textContent = el.querySelector('.cmd').classList.contains('open') ? 'menos' : 'ver todo'; }; }
function step(icon, nameHtml, out) {
  const first = out == null ? '' : String(out).split('\n')[0].slice(0, 140);
  const body = out == null ? '' : `<details><summary>${esc(first)} <span style="color:var(--dimmer)">(${String(out).length} chars)</span></summary><pre>${esc(out)}</pre></details>`;
  add('step', `<span class="ic">${icon}</span><span class="name">${nameHtml}</span>${body}`);
}
function empty() {
  const name = (cfg.workspace || '').split(/[\\/]/).filter(Boolean).pop() || 'workspace';
  log.innerHTML = `<div class="empty">
    <h1>${esc(name)}</h1>
    <p class="lead">Un agente con herramientas acotadas a este proyecto. Vos pedís; él lee, busca, edita y corre comandos — y cada paso queda a la vista.</p>
    <div class="grid">
      <div class="card"><h3>Probá</h3>
        <p><span class="try">Explicame la estructura de este proyecto</span></p>
        <p><span class="try">¿Dónde está el punto de entrada y qué hace?</span></p>
        <p><span class="try">Buscá TODOs y proponé un plan para resolverlos</span></p>
        <p><span class="try">Corré los tests y contame qué falla</span></p></div>
      <div class="card"><h3>Agentes</h3>
        <p><span class="k">build</span> edita y ejecuta (por defecto)</p>
        <p><span class="k">plan</span> solo lectura: investiga y propone</p>
        <p><span class="k">review</span> lee y corre tests, no edita</p>
        <p><span class="k">explore</span> localiza código</p></div>
      <div class="card"><h3>Qué puede tocar</h3>
        <p>Solo archivos dentro de <code>${esc(cfg.workspace || 'workspace')}</code>.</p>
        <p>Comandos peligrosos (borrar recursivo, <code>git push --force</code>, <code>sudo</code>…) según el selector <span class="k">permisos</span> de arriba: <b>preguntar</b> te muestra una tarjeta para aprobar, <b>permitir todo</b> no pregunta, <b>denegar</b> los bloquea. Los comandos destructivos del sistema (<code>rm -rf /</code>, formatear…) se bloquean siempre.</p></div>
      <div class="card"><h3>Cómo lo ve el modelo</h3>
        <p>Cada llamada a una tool y su resultado — incluidos errores y rechazos — queda en el historial y se le reenvía en cada turno.</p>
        <p>Hacé clic en un archivo a la izquierda para verlo.</p></div>
    </div></div>`;
  log.querySelectorAll('.try').forEach(el => el.onclick = () => { $('#in').value = el.textContent; $('#in').focus(); });
}

// ---- config / header ----
async function loadCfg() {
  try { cfg = await (await fetch('/api/config')).json(); } catch (e) { cfg = {}; }
  const ws = cfg.workspace || '';
  $('#proj').innerHTML = '<b>' + esc(ws.split(/[\\/]/).filter(Boolean).pop() || 'workspace') + '</b><small>' + esc(ws) + '</small>';
  $('#perm').value = localStorage.getItem('lampson.perm') || cfg.permission || 'ask'; $('#perm').onchange = () => localStorage.setItem('lampson.perm', $('#perm').value);
  $('#model').textContent = cfg.model || '';
  const sel = $('#agent'); sel.innerHTML = '';
  for (const a of (cfg.agents || ['build'])) { const o = document.createElement('option'); o.value = a; o.textContent = 'agente: ' + a; sel.appendChild(o); }
  sel.value = localStorage.getItem('lampson.agent') || 'build';
  const hint = () => { const p = (cfg.profiles || {})[sel.value]; const t = p ? sel.value + ' · ' + p.tools.join(' · ') : ''; $('#agentHint').textContent = t; $('#agentHint2').textContent = t; };
  sel.onchange = () => { localStorage.setItem('lampson.agent', sel.value); hint(); }; hint();
  if (!log.children.length) empty();
}

// ---- file tree + viewer ----
let gitStatus = { changes: {} };
async function loadGit() {
  try { gitStatus = await (await fetch('/api/git')).json(); } catch (e) { gitStatus = { repo: false, changes: {} }; }
  const g = $('#git'); if (!gitStatus.repo) { g.textContent = ''; return; }
  const k = gitStatus.counts || {}; const n = (k.modified||0)+(k.added||0)+(k.deleted||0)+(k.untracked||0);
  g.innerHTML = `⎇ ${esc(gitStatus.branch)} · ` + (n ? `<span style="color:var(--warn)">${k.modified||0} mod</span> · <span style="color:var(--ok)">${k.untracked||0} nuevos</span> · <span style="color:var(--bad)">${k.deleted||0} borrados</span>` : 'limpio');
}
function gitClass(path, isDir) {
  const ch = gitStatus.changes || {};
  if (!isDir) { const c = ch[path]; return c === '??' ? 'gU' : c === 'A' ? 'gA' : c === 'D' ? 'gD' : c ? 'gM' : ''; }
  const p = path + '/'; for (const k in ch) if (k.startsWith(p)) return 'gM'; return '';
}
async function loadTree() {
  await loadGit();
  const box = $('#tree'); box.innerHTML = '';
  let t; try { t = await (await fetch('/api/tree')).json(); } catch (e) { box.textContent = 'sin árbol'; return; }
  const render = (entries, parent, depth) => {
    for (const e of entries) {
      const n = document.createElement('div'); n.className = 'node';
      const gc = gitClass(e.path, e.is_dir); const code = (gitStatus.changes || {})[e.path];
      const r = document.createElement('div'); r.className = 'row' + (e.is_dir ? ' dir' : '') + (gc ? ' ' + gc : ''); r.title = e.path + (code ? ' · git ' + code : '');
      r.innerHTML = `<span class="tw">${e.is_dir ? '▸' : ''}</span><span>${esc(e.name)}${e.is_dir ? '/' : ''}</span>` + (code && !e.is_dir ? `<span class="gs">${code === '??' ? 'N' : code}</span>` : '');
      n.appendChild(r);
      if (e.is_dir) {
        const k = document.createElement('div'); k.className = 'kids hidden'; render(e.children || [], k, depth + 1); n.appendChild(k);
        r.querySelector('.tw').textContent = '▸';
        r.onclick = () => { k.classList.toggle('hidden'); r.querySelector('.tw').textContent = k.classList.contains('hidden') ? '▸' : '▾'; };
      } else { r.onclick = () => openFile(e.path, r); }
      parent.appendChild(n);
    }
  };
  render(t.entries || [], box, 0);
  if (t.truncated) { const d = document.createElement('div'); d.className = 'row'; d.textContent = '… árbol truncado'; box.appendChild(d); }
}
async function openFile(path, row) {
  document.querySelectorAll('.row.active').forEach(x => x.classList.remove('active')); if (row) row.classList.add('active');
  const r = await fetch('/api/file?path=' + encodeURIComponent(path)); const d = await r.json();
  if (!r.ok) { add('denied', esc(d.error || 'error')); return; }
  $('#vpath').textContent = d.path; $('#vmeta').textContent = d.lines + ' líneas';
  $('#vbody').innerHTML = String(d.content).split('\n').map((l, i) => `<span class="ln">${i + 1}</span>${esc(l)}`).join('\n');
  log.style.display = 'none'; $('#viewer').style.display = 'block'; $('#stage').scrollTop = 0;
}
$('#vclose').onclick = () => { $('#viewer').style.display = 'none'; log.style.display = ''; procOpen = null; clearInterval(procTimer); $('#vbody').className = ''; document.querySelectorAll('.row.active').forEach(x => x.classList.remove('active')); };

// ---- procesos gestionados ----
let procOpen = null, procTimer = null;
async function loadPorts() {
  let r; try { r = await (await fetch('/api/ports')).json(); } catch (e) { return; }
  const box = $('#ports'); box.innerHTML = '';
  const list = (r.ports || []).filter(p => p.port !== 8080 || p.name !== 'synsema.exe');
  if (!list.length) { box.innerHTML = '<div class="p" style="cursor:default;color:var(--dimmer)">ninguno</div>'; return; }
  for (const p of list) {
    const d = document.createElement('div'); d.className = 'p'; d.style.cursor = 'default'; d.title = `pid ${p.pid}`;
    d.innerHTML = `<span class="port">:${p.port}</span><span class="cm">${esc(p.name)} · pid ${p.pid}</span><button class="ghost" title="matar este proceso (no lo gestiona lampson)">✕</button>`;
    d.querySelector('button').onclick = async () => { if (!confirm(`¿Matar ${p.name} (pid ${p.pid}) que escucha en :${p.port}?`)) return; await fetch('/api/ports/kill', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ pid: p.pid }) }); loadPorts(); };
    box.appendChild(d);
  }
}
async function loadProcs() {
  loadPorts();
  let r; try { r = await (await fetch('/api/proc')).json(); } catch (e) { return; }
  const box = $('#procs'); box.innerHTML = '';
  const list = r.processes || []; $('#procCount').textContent = list.length ? `(${list.filter(p => p.running).length} activos)` : '';
  if (!list.length) { box.innerHTML = '<div class="p" style="cursor:default;color:var(--dimmer)">ninguno — el agente los arranca con la tool process</div>'; return; }
  for (const p of list) {
    const d = document.createElement('div'); d.className = 'p' + (p.running ? ' run' : '') + (procOpen === p.name ? ' active' : ''); d.title = p.command;
    d.innerHTML = `<span class="st"></span><span class="nm">${esc(p.name)}</span><span class="cm">$ ${esc(p.command)}</span>` + (p.running ? '<button class="ghost">■</button>' : '');
    d.onclick = () => openProc(p.name);
    const b = d.querySelector('button'); if (b) b.onclick = async (ev) => { ev.stopPropagation(); await fetch('/api/proc/stop', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ name: p.name }) }); loadProcs(); if (procOpen === p.name) openProc(p.name); };
    box.appendChild(d);
  }
}
async function openProc(name) {
  procOpen = name; document.querySelectorAll('.row.active').forEach(x => x.classList.remove('active'));
  const r = await (await fetch('/api/proc/log?name=' + encodeURIComponent(name) + '&tail=400')).json();
  $('#vpath').textContent = 'proceso ' + name; $('#vmeta').textContent = r.running ? '● corriendo · log en vivo' : '○ terminado';
  const pre = $('#vbody'); pre.className = 'log'; pre.textContent = r.log || '(sin salida todavía)';
  log.style.display = 'none'; $('#viewer').style.display = 'block'; $('#stage').scrollTop = $('#stage').scrollHeight;
  clearInterval(procTimer); if (r.running) procTimer = setInterval(async () => { if (procOpen !== name || $('#viewer').style.display === 'none') { clearInterval(procTimer); return; } const x = await (await fetch('/api/proc/log?name=' + encodeURIComponent(name) + '&tail=400')).json(); pre.textContent = x.log || ''; $('#vmeta').textContent = x.running ? '● corriendo · log en vivo' : '○ terminado'; if (!x.running) { clearInterval(procTimer); loadProcs(); } }, 2000);
  loadProcs();
}

// ---- sessions ----
async function loadSessions() {
  const r = await (await fetch('/api/sessions')).json();
  const box = $('#sessions'); box.innerHTML = '';
  for (const s of r.sessions) { const d = document.createElement('div'); d.className = 's' + (s.id === session ? ' active' : ''); d.innerHTML = '<span class="id">' + esc(s.id.slice(-6)) + '</span>' + esc(s.title || ''); d.title = s.id; d.onclick = () => open(s.id); box.appendChild(d); }
}
async function open(id) {
  session = id; localStorage.setItem('lampson.session', id); log.innerHTML = ''; $('#viewer').style.display = 'none'; log.style.display = '';
  const r = await fetch('/api/sessions/' + id); if (!r.ok) { session = ''; empty(); return loadSessions(); }
  const d = await r.json();
  const queue = []; // pasos sin resultado todavía, en orden (varias tool calls por turno)
  for (const m of d.messages) {
    if (m.role === 'user') { queue.length = 0; add('user', esc(m.content)); }
    else if (m.role === 'assistant') { if (m.content) add('assistant', md(m.content)); for (const c of (m.tool_calls || [])) { const el = add('step', `<span class="ic">⚙</span>${cmdHtml(describe(c))}`); wireMore(el); queue.push(el); } }
    else if (m.role === 'tool') { const out = String(m.content); const bad = /^(ERROR|DENIED)/.test(out); const el = queue.shift() || add('step', '<span class="ic">→</span>'); const ic = el.querySelector('.ic'); if (ic) { ic.textContent = bad ? '✗' : '✓'; ic.className = 'ic ' + (bad ? 'bad' : 'ok'); } el.insertAdjacentHTML('beforeend', `<details><summary class="${bad ? 'bad' : ''}">${esc(out.split('\n')[0].slice(0, 140))} <span style="color:var(--dimmer)">(${out.length} chars)</span></summary><pre>${esc(out)}</pre></details>`); }
  }
  loadSessions();
}
$('#new').onclick = () => { session = ''; localStorage.removeItem('lampson.session'); log.innerHTML = ''; empty(); loadSessions(); };

// ---- chat (SSE) ----
let aborter = null;
function setBusy(b) { busy = b; $('#f').classList.toggle('busy', b); $('#send').disabled = b; }
$('#stop').onclick = () => { if (aborter) aborter.abort(); };
async function send(message) {
  setBusy(true); aborter = new AbortController();
  if (log.querySelector('.empty')) log.innerHTML = '';
  add('user', esc(message));
  const thinking = add('working', '<span class="dot"></span><span>pensando…</span>');
  try {
    const res = await fetch('/api/chat', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ session, message, agent: $('#agent').value || 'build', permission: $('#perm').value || 'ask' }), signal: aborter.signal });
    if (!res.ok || !res.body) { add('denied', 'error HTTP ' + res.status + ' ' + esc(await res.text())); }
    else {
      const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
      while (true) {
        const { value, done } = await reader.read(); if (done) break;
        buf += dec.decode(value, { stream: true });
        let i; while ((i = buf.indexOf('\n\n')) >= 0) { const chunk = buf.slice(0, i); buf = buf.slice(i + 2); handle(chunk, thinking); }
      }
    }
  } catch (e) { add('meta', e.name === 'AbortError' ? '■ detenido por vos (el agente para en el próximo paso; el historial queda guardado hasta ahí)' : '‼ ' + esc(e.message)); }
  thinking.remove(); aborter = null; setBusy(false); loadSessions(); loadTree(); loadProcs();
}
let pending = null;
function handle(chunk, thinking) {
  const data = chunk.split('\n').filter(l => l.startsWith('data:')).map(l => l.slice(5).trim()).join('\n'); if (!data) return;
  let ev; try { ev = JSON.parse(data); } catch { return; }
  const k = ev.kind, d = ev.data;
  if (k === 'session') { session = d; localStorage.setItem('lampson.session', d); }
  else if (k === 'assistant') add('assistant', md(d));
  else if (k === 'tool_call') { thinking.querySelector('span:last-child').textContent = 'ejecutando ' + esc(d.name) + '…'; pending = add('step', `<span class="ic">⚙</span>${cmdHtml(describe(d))}`); wireMore(pending); if (d.name === 'process') setTimeout(loadProcs, 2500); }
  else if (k === 'tool_result') { const out = String(d.output); const bad = /^(ERROR|DENIED)/.test(out); const el = pending || add('step', '<span class="ic">→</span>'); pending = null; thinking.querySelector('span:last-child').textContent = 'pensando…'; const ic = el.querySelector('.ic'); if (ic) { ic.textContent = bad ? '✗' : '✓'; ic.className = 'ic ' + (bad ? 'bad' : 'ok'); } el.insertAdjacentHTML('beforeend', `<details><summary class="${bad ? 'bad' : ''}">${esc(out.split('\n')[0].slice(0, 140))} <span style="color:var(--dimmer)">(${out.length} chars)</span></summary><pre>${esc(out)}</pre></details>`); }
  else if (k === 'approval_request') { const el = add('approval', `<div class="card"><div class="why">⚠ ${esc(d.why)}</div><code>${esc(describe({name: d.name, args: d.args}))}</code><div class="btns"><button data-ok="1">Permitir</button><button class="ghost" data-ok="0">Denegar</button></div></div>`); el.querySelectorAll('button').forEach(b => b.onclick = async () => { el.querySelectorAll('button').forEach(x => x.disabled = true); await fetch('/api/approve', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: d.id, decision: b.dataset.ok === '1' }) }); }); el.dataset.id = d.id; }
  else if (k === 'approval_result') { const el = [...log.querySelectorAll('.approval')].find(x => x.dataset.id === d.id); if (el) el.querySelector('.btns').innerHTML = d.approved ? '<span style="color:var(--ok)">✓ permitido</span>' : (d.timeout ? '<span class="denied">✗ sin respuesta, denegado</span>' : '<span class="denied">✗ denegado</span>'); }
  else if (k === 'mode') { $('#agent').value = d.agent; $('#perm').value = d.permission; }
  else if (k === 'tool_denied') { const el = pending || add('step', '<span class="ic">✗</span>'); el.insertAdjacentHTML('beforeend', `<span class="denied"> ✗ ${esc(d.reason)}</span>`); }
  else if (k === 'error') add('denied', '‼ ' + esc(d));
  else if (k === 'compact') add('meta', '⧗ compactando contexto (~' + d.before + ' tokens)');
  else if (k === 'done') { if (d.stopped !== 'user_command') add('meta', `${d.steps} paso${d.steps === 1 ? '' : 's'} · ${d.usage.input + d.usage.output} tokens · ${d.stopped}`); }
  log.appendChild(thinking); $('#stage').scrollTop = $('#stage').scrollHeight;
}
$('#f').onsubmit = e => { e.preventDefault(); const t = $('#in').value.trim(); if (!t || busy) return; $('#in').value = ''; send(t); };
$('#in').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!busy) $('#f').requestSubmit(); } });
$('#in').addEventListener('input', () => { const t = $('#in'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 220) + 'px'; });
loadCfg().then(() => { loadTree(); loadSessions(); loadProcs(); const pq = new URLSearchParams(location.search).get('proc'); if (pq) openProc(pq); else if (session) open(session); });
setInterval(loadProcs, 10000);
</script>
