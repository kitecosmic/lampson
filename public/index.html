<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Lampson</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- estilos: tokens (fuentes, paleta, base) → layout (grid, cabecera, paneles, chat, composer) → sidebar → chat → panel (el modal) -->
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/sidebar.css">
<link rel="stylesheet" href="/css/chat.css">
<link rel="stylesheet" href="/css/panel.css">
<link rel="stylesheet" href="/vendor/xterm.css">
<script src="/vendor/xterm.js"></script>
<script src="/vendor/xterm-addon-fit.js"></script>
<script>(function(){try{var t=localStorage.getItem('lampson.theme');if(t!=='light'&&t!=='dark'){t='dark';}document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<header>
  <div class="hrow">
    <span class="brand">lampson<span class="proj" id="proj">…</span></span>
    <span class="spacer"></span>
    <button class="hbtn upd" id="update" style="display:none"></button>
    <button class="hbtn" id="term" title="terminal real (shell en el workspace): lo abre, lo trae de vuelta si está minimizado y lo esconde si está a la vista — verde = shell abierta">&gt;_ terminal</button>
    <button class="hbtn" id="new" title="empezar una conversación nueva">+ sesión</button>
    <button class="theme-toggle" id="cfgBtn" type="button" title="configuración: zona horaria, aprobaciones a distancia, proveedor"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    <button class="theme-toggle" id="theme" type="button" title="cambiar tema"></button>
  </div>
  <div class="hrow sub">
    <span class="gitchip" id="git"></span>
    <span class="hpath" id="hpath"></span>
    <select id="agent" title="perfil de agente: qué tools puede usar"></select>
    <select id="perm" title="qué pasa con un comando peligroso (rm -rf, git push --force, sudo…)"><option value="ask">permisos: preguntar</option><option value="yolo">permisos: permitir todo</option><option value="strict">permisos: denegar</option></select>
    <span class="pill on" id="wsPill" style="display:none" title="cambiar de workspace">workspace ▾</span>
    <span class="pill" id="lamps" title="lámparas: plugins de tools que vos encendés · clic para ver y activar">lámparas</span>
    <span class="pill" id="model" title="proveedor y modelo · clic para cambiarlos o cargar una API key">…</span>
  </div>
</header>
<aside>
  <button class="fold" title="plegar este panel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button>
  <div class="rail"><button title="desplegar el panel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg></button></div>
  <section class="sec open" data-sec="sessions">
    <h2 title="las últimas conversaciones de este workspace; «ver todas» abre el buscador"><span class="caret">▾</span>Sesiones<span class="cnt" id="sessCount"></span><button class="h2act" id="sessAll" title="ver todas y buscar">⌕</button></h2>
    <div class="body" id="sessions"></div>
  </section>
  <section class="sec" data-sec="procs">
    <h2 title="procesos que el agente arranca con la tool process"><span class="caret">▸</span>Procesos<span class="cnt" id="procCount"></span></h2>
    <div class="body" id="procs"></div>
  </section>
  <section class="sec" data-sec="todo">
    <h2 title="lista de tareas que el agente mantiene con la tool todo (una en curso a la vez)"><span class="caret">▸</span>Tareas<span class="cnt" id="todoCount"></span></h2>
    <div class="body" id="todoBox"></div>
  </section>
  <section class="sec" data-sec="agents">
    <h2 title="subagentes que el agente lanza con la tool delegate (en paralelo o en background); clic = log en vivo"><span class="caret">▸</span>Subagentes<span class="cnt" id="agentCount"></span></h2>
    <div class="body" id="agentsBox"></div>
  </section>
  <section class="sec" data-sec="mcp">
    <h2 title="servers MCP conectados: globales (lampson/.lampson/mcp.json, valen para todos los proyectos) y del proyecto (.lampson/mcp.json)"><span class="caret">▸</span>MCP<span class="cnt" id="mcpCount"></span></h2>
    <div class="body" id="mcpBox"></div>
  </section>
  <section class="sec" data-sec="lsp">
    <h2 title="language servers: el agente los usa para ver la estructura de un archivo sin leerlo (symbols) y navegar con precisión (definition, references, hover). Arrancan en la primera consulta"><span class="caret">▸</span>LSP<span class="cnt" id="lspCount"></span></h2>
    <div class="body" id="lspBox"></div>
  </section>
  <section class="sec" data-sec="memory">
    <h2 title="notas que el agente guarda sobre este proyecto con la tool memory"><span class="caret">▸</span>Memoria<span class="cnt" id="memCount"></span></h2>
    <div class="body" id="memory"></div>
  </section>
  <section class="sec" data-sec="ports">
    <h2 title="puertos TCP en escucha en esta máquina — de cualquier programa, no solo de lampson (útil para saber quién ocupa un puerto)"><span class="caret">▸</span>Puertos<span class="cnt" id="portCount"></span></h2>
    <div class="body" id="ports"></div>
  </section>
  <section class="sec" data-sec="approvals">
    <h2 title="acciones que esperan tu permiso: del chat o de una tarea programada corriendo sola. También llegan por webhook/link si configuraste la URL pública y el webhook (⚙)"><span class="caret">▸</span>Aprobaciones<span class="cnt" id="apprCount"></span></h2>
    <div class="body" id="apprBox"></div>
  </section>
  <section class="sec" data-sec="sched">
    <h2 title="tareas programadas (cada 6 h, todos los días a las 9, lunes 8:30…): una lámpara, un comando o una corrida del agente. Corren mientras lampson esté abierto, o con lampson --daemon start"><span class="caret">▸</span>Programadas<span class="cnt" id="schedCount"></span><button class="h2act" id="schedAddBtn" title="programar una tarea">+</button></h2>
    <div class="body" id="schedBox"></div>
  </section>
</aside>
<aside class="right">
  <button class="fold" title="plegar el árbol de archivos"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
  <div class="rail"><button title="mostrar el árbol de archivos"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></button></div>
  <section class="sec grow open" data-sec="tree">
    <h2><span class="caret">▾</span>Archivos<button class="h2act" id="tree-reload" title="recargar el árbol">↻</button></h2>
    <div class="body" id="tree"></div>
  </section>
</aside>
<main>
  <div id="stage">
    <div id="viewer"><div class="vh"><b id="vpath"></b><span id="vmeta"></span><span class="spacer"></span><span class="x" id="vclose">✕ cerrar</span></div><pre id="vbody"></pre></div>
    <div id="log"></div>
    <div id="termpane"><div class="vh"><span class="st"></span><b>terminal</b><span class="ttabs" id="ttabs"></span><button class="hbtn sm new" id="tnew" title="abrir otra terminal: una shell nueva en el workspace">+ nueva terminal</button><span id="tmeta"></span><span class="spacer"></span><span class="wbtn" id="tmin" title="minimizar: esconde el panel y la shell sigue viva">&#8212;</span><span class="wbtn" id="tmax" title="pantalla completa">&#9633;</span><span class="wbtn cl" id="tclose" title="cerrar esta terminal y matar su shell">&#10005;</span></div><div id="xterms"></div></div>
  </div>
  <div>
    <form id="f">
      <div class="composer">
        <div class="attach" id="attach"></div>
        <textarea id="in" rows="1" placeholder="¿Qué hacemos en este proyecto?  ·  !comando lo corrés vos  ·  Ctrl+V pega una imagen"></textarea>
        <div class="crow"><span class="tools" id="agentHint2"></span><span class="keys">Enter envía · Shift+Enter salto</span><button id="stop" type="button" title="cortar el turno actual">■ detener</button><button id="send" class="primary" type="submit" title="enviar (Enter)">↑</button></div>
      </div>
    </form>
    <div class="hint" id="agentHint"></div>
  </div>
</main>
<!-- módulos (scripts clásicos, en orden): core y el componente Panel primero, las vistas después, app.js arranca -->
<script src="/js/core.js"></script>
<script src="/js/panel.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/sidebar.js"></script>
<script src="/js/tree.js"></script>
<script src="/js/terminal.js"></script>
<script src="/js/procs.js"></script>
<script src="/js/agents.js"></script>
<script src="/js/memory.js"></script>
<script src="/js/todo.js"></script>
<script src="/js/mcp.js"></script>
<script src="/js/lsp.js"></script>
<script src="/js/lamps.js"></script>
<script src="/js/schedules.js"></script>
<script src="/js/approvals.js"></script>
<script src="/js/config.js"></script>
<script src="/js/workspaces.js"></script>
<script src="/js/update.js"></script>
<script src="/js/sessions.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/events.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
