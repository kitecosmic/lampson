<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131412">
<title>Lampson · sin conexión</title>
<link rel="stylesheet" href="/css/tokens.css">
<style>
  body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .box { max-width:420px; }
  h1 { font:600 22px/1.3 var(--serif); margin:0 0 8px; }
  p { color:var(--ink-2); margin:0 0 16px; }
  button { font:400 13px var(--mono); padding:8px 14px; background:transparent; color:var(--accent); border:1px solid var(--accent); border-radius:var(--r); }
</style>
</head>
<body>
<div class="box">
  <h1>Tu PC no responde</h1>
  <p>Lampson corre en tu PC: tiene que estar prendida, con lampson y el túnel andando (<code>lampson --install</code> lo arranca solo al iniciar sesión). Si estás sin señal, revisá tu conexión.</p>
  <button onclick="location.reload()">reintentar</button>
</div>
</body>
</html>
